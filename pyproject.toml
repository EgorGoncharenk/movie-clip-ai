[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-clip-ai"
version = "0.8.0"
description = "Local Windows CLI for preparing vertical clips from owned video files"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.2,<2",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "PySide6>=6.8,<7",
    "opencv-python>=4.10,<6",
    "psutil>=6,<8",
    "rich>=13,<15",
    "scenedetect>=0.7,<0.8",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
movie-clip-ai = "app.main:main"
movie-clip-ai-gui = "app.gui:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: invokes installed media tools and writes temporary files",
]
